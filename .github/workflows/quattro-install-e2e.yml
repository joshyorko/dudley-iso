name: Quattro ISO and VM install

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-upstream-unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Dudley contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run pinned upstream fast tests
        run: |
          upstream="$RUNNER_TEMP/omarchy-iso"
          git clone --filter=blob:none --branch quattro --single-branch --no-checkout \
            "$(cat omarchy-quattro/upstream_url)" "$upstream"
          git -C "$upstream" checkout --detach "$(cat omarchy-quattro/upstream_revision)"
          git -C "$upstream" submodule update --init --recursive
          cd "$upstream"
          # The upstream suite calls host-localectl and systemd-firstboot. The
          # hosted runner is not booted with systemd, so provide only the
          # deterministic command surface those unit tests exercise.
          testbin="$RUNNER_TEMP/omarchy-iso-test-bin"
          mkdir -p "$testbin"
          cat >"$testbin/localectl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            --no-pager)
              [[ "${2:-}" == list-keymaps ]] || exit 1
              printf '%s\n' us uk de fr es
              ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 0755 "$testbin/localectl"
          cat >"$testbin/systemd-firstboot" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/systemd-firstboot "$@"
          root=/
          keymap=
          for arg in "$@"; do
            case "$arg" in
              --root=*) root=${arg#--root=} ;;
              --keymap=*) keymap=${arg#--keymap=} ;;
            esac
          done
          if [[ -n "$keymap" && -f "$root/etc/vconsole.conf" ]] &&
             ! grep -q '^XKBLAYOUT=' "$root/etc/vconsole.conf"; then
            printf 'XKBLAYOUT=%s\n' "$keymap" >>"$root/etc/vconsole.conf"
          fi
          EOF
          chmod 0755 "$testbin/systemd-firstboot"
          PATH="$testbin:$PATH" ./test/all

  accepted-image-input:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check accepted OS image input
        id: check
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          config = json.loads(Path("omarchy-quattro/image.json").read_text())
          accepted = config["accepted_source_ref"]
          if not accepted:
              print("Quattro ISO build and VM install skipped: accepted OS digest is not yet reviewed.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("ready=false\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Quattro ISO build and VM install skipped: accepted OS digest is not yet reviewed.\n")
              raise SystemExit(0)
          if not re.fullmatch(r"ghcr\.io/joshyorko/omarchy-bootc@sha256:[0-9a-f]{64}", accepted):
              raise SystemExit("accepted_source_ref must be an exact ghcr.io digest")
          if not config["accepted_signer_identity"] or not config["accepted_signer_oidc_issuer"]:
              raise SystemExit("keyless signer identity and issuer must be configured")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=true\n")
          PY

  build-and-install:
    needs: [accepted-image-input, pinned-upstream-unit]
    if: needs.accepted-image-input.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ISO build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go podman qemu-system-x86 qemu-utils ovmf socat imagemagick tesseract-ocr tesseract-ocr-eng xorriso jq git
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Build offline Quattro ISO
        run: just iso omarchy-quattro

      - name: Verify and record build receipts
        run: |
          sha256sum --check output/omarchy-quattro/omarchy-quattro.iso.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          image = json.loads(Path("omarchy-quattro/image.json").read_text())
          receipt = json.loads(Path("output/omarchy-quattro/omarchy-quattro.image-signature.json").read_text())
          expected = {
              "source_ref": image["accepted_source_ref"],
              "source_digest": image["accepted_source_ref"].rsplit("@", 1)[1],
              "certificate_identity": image["accepted_signer_identity"],
              "certificate_oidc_issuer": image["accepted_signer_oidc_issuer"],
          }
          if any(receipt.get(key) != value for key, value in expected.items()):
              raise SystemExit("retained image signature receipt differs from accepted build inputs")
          if not isinstance(receipt.get("verified_signatures"), list) or not receipt["verified_signatures"]:
              raise SystemExit("retained image signature receipt contains no verified signature")
          PY
          sha256sum output/omarchy-quattro/omarchy-quattro.image-signature.json
          echo "Image signature receipt SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum output/omarchy-quattro/omarchy-quattro.image-signature.json >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare upstream VM install harness
        run: |
          mkdir -p output/omarchy-quattro/upstream-harness
          git clone --filter=blob:none --branch quattro --single-branch --no-checkout \
            "$(cat omarchy-quattro/upstream_url)" output/omarchy-quattro/upstream-harness
          git -C output/omarchy-quattro/upstream-harness checkout --detach "$(cat omarchy-quattro/upstream_revision)"
          sudo mkdir -p /usr/share/edk2/x64
          sudo ln -sf /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/edk2/x64/OVMF_CODE.4m.fd
          sudo ln -sf /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/edk2/x64/OVMF_VARS.4m.fd
          harness=output/omarchy-quattro/upstream-harness/bin/omarchy-iso-test
          sed -i \
            's/omarchy-pkg-add qemu-full edk2-ovmf socat imagemagick tesseract tesseract-data-eng/sudo apt-get update \&\& sudo apt-get install -y qemu-system-x86 qemu-utils ovmf socat imagemagick tesseract-ocr tesseract-ocr-eng/' \
            "$harness"
          sed -i 's/-cpu host -enable-kvm -machine q35,accel=kvm/-cpu max -machine q35,accel=tcg,thread=multi/' "$harness"

      - name: Install Quattro ISO into a QEMU VM
        run: |
          cd output/omarchy-quattro/upstream-harness
          ./bin/omarchy-iso-test ../omarchy-quattro.iso --install-only --no-preview --timeout 14400

      - name: Upload ISO, checksum, and VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quattro-iso-vm-evidence
          if-no-files-found: warn
          path: |
            output/omarchy-quattro/omarchy-quattro.iso
            output/omarchy-quattro/omarchy-quattro.iso.sha256
            output/omarchy-quattro/omarchy-quattro.image-signature.json
            output/omarchy-quattro/upstream-harness/test-runs/**
